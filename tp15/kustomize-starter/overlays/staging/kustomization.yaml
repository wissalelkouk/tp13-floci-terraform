apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tp15-staging

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=staging
      - LOG_LEVEL=info

replicas:
  - name: whoami
    count: 2
