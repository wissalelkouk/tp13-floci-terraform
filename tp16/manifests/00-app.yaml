# TP16 : application protégée (whoami) dans son namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: tp16
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tp16
spec:
  replicas: 1
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.0
          args: ["--port", "8080"]
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: tp16
spec:
  selector: { app: whoami }
  ports: [{ name: http, port: 80, targetPort: http }]
