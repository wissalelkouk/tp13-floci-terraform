# TP16 partie 2 : Ingress HTTPS. L'annotation demande à cert-manager de créer le certificat.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: tp16
  annotations:
    cert-manager.io/cluster-issuer: lab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - whoami.lab.local
      secretName: whoami-tls
  rules:
    - host: whoami.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: { name: http }
