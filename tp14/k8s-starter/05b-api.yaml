# TP14 partie 3 : second service (nginx) servi sous /api.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-page
  namespace: tp14
data:
  index.html: |
    <h1>Service API (nginx)</h1>
    <p>Servi sous /api par l'Ingress Traefik.</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tp14
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/api
      volumes:
        - name: page
          configMap:
            name: api-page
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tp14
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
